name: Deploy Poke-Memo
on: 
  push:
    branches:
      - main
jobs:
  Explore-Github-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
        
      - name: install dependencies
        run: npm install

      - name: Build
        run: npm run build